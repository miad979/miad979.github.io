name: "Md Miadul Islam Nizzan"
description: "Computer Science & Engineering Student | AI/ML, Deep Learning & Cybersecurity Enthusiast"

bio: "Final-year Computer Science and Engineering undergraduate at the Green University of Bangladesh (CGPA: 3.70) and recipient of the Vice Chancellor and Dean’s Awards for academic excellence[cite: 1]. I am deeply passionate about applying technology to solve real-world problems, with a strong focus on Artificial Intelligence, Machine Learning, Deep Learning, and secure systems architecture[cite: 1]. Alongside my studies, I actively drive community engagement and technical programs as the Vice Chair of the IEEE GUB Student Branch while gaining industry exposure through specialized training in Networking and Cybersecurity[cite: 1]."

