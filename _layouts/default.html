<!doctype html>
<html lang="en">
  <head>
    {% include meta.html %}
    <meta name="theme-color" content="#f4f1ea">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.name }} home"><span class="wordmark-mark">MN</span><span class="wordmark-name">{{ site.short_name }}</span></a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span><span class="sr-only">Toggle navigation</span></button>
        <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
          {% for link in site.navigation %}<a href="{{ link.url | relative_url }}" {% if page.url == link.url %}aria-current="page"{% endif %}>{{ link.title }}</a>{% endfor %}
          <a class="nav-cta" href="{{ '/contact/' | relative_url }}">Let’s talk <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main" class="shell page-content">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-grid">
        <div><p class="footer-kicker">Have an idea worth building?</p><a class="footer-title" href="mailto:{{ site.email }}">Let’s make it real.</a></div>
        <div class="footer-links"><a href="{{ site.github_url }}" target="_blank" rel="noopener">GitHub <span>↗</span></a><a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn <span>↗</span></a><a href="mailto:{{ site.email }}">Email <span>↗</span></a></div>
      </div>
      <div class="shell footer-base"><span>© <span data-year></span> {{ site.name }}</span><span>Designed & built with care in Bangladesh.</span></div>
    </footer>
  </body>
</html>
