name: Auto Process Jupyter Notebooks

on:
  push:
    paths:
      - '**/*.ipynb'

jobs:
  organize-notebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Move Notebook and Generate Pointer Post
        run: |
          python -c "
          import os
          import json
          from datetime import datetime

          posts_dir = '_posts'
          assets_dir = 'assets/jupyter'
          
          os.makedirs(posts_dir, exist_ok=True)
          os.makedirs(assets_dir, exist_ok=True)

          for root, dirs, files in os.walk('.'):
              if assets_dir in root or '.github' in root or '.git' in root or posts_dir in root:
                  continue
                  
              for file in files:
                  if file.endswith('.ipynb'):
                      old_path = os.path.join(root, file)
                      new_notebook_path = os.path.join(assets_dir, file)
                      
                      # Read the file and strip out any broken text strings at the very start
                      with open(old_path, 'r', encoding='utf-8') as f:
                          raw_data = f.read()
                      
                      start_json = raw_data.find('{')
                      if start_json == -1:
                          continue
                      
                      clean_json = raw_data[start_json:]
                      
                      try:
                          # Verify it is clean JSON data
                          notebook_data = json.loads(clean_json)
                      except Exception as e:
                          print(f'Skipping corrupted file {file}: {e}')
                          continue
                          
                      # Save the perfectly cleaned notebook file directly into assets
                      with open(new_notebook_path, 'w', encoding='utf-8') as f:
                          json.dump(notebook_data, f, indent=2)
                      
                      # Remove the old raw file from root
                      os.remove(old_path)
                      
                      # Generate your clean text post signpost
                      clean_title = os.path.splitext(file)[0].replace('_', ' ').replace('-', ' ').title()
                      if len(clean_title) > 11 and clean_title[4] == ' ' and clean_title[7] == ' ':
                          clean_title = clean_title[11:]
                          
                      current_date = datetime.now().strftime('%Y-%m-%d 12:00:00 +0600')
                      file_date = datetime.now().strftime('%Y-%m-%d')
                      
                      pointer_filename = f'{file_date}-{os.path.splitext(file)[0]}.md'
                      pointer_path = os.path.join(posts_dir, pointer_filename)
                      
                      front_matter = f'---\nlayout: post\ntitle: \"{clean_title}\"\ndate: {current_date}\ncategories: [machine-learning, deep-learning]\nipynb: {file}\n---\n'
                      
                      with open(pointer_path, 'w', encoding='utf-8') as f:
                          f.write(front_matter)
          "

      - name: Commit and Push Changes Back to GitHub
        uses: stefanzwei/github-actions-commit-push@v1
        with:
          commit_message: "automated: successfully cleaned notebook structure and built blog pointer"
